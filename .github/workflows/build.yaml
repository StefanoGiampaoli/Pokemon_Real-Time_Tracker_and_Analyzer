name: Build and Release Windows Executable

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build with PyInstaller
        run: uv run pyinstaller --noconfirm --onefile --name "PokemonTracker" --icon="ultraball.ico" --add-data "datasets/final_pokemon.csv;datasets" main.py

      # normal push --> load the artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonTracker.exe
          path: dist/PokemonTracker.exe

      # git push with tag --> automatically create a new public release with the executable file
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PokemonTracker.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}